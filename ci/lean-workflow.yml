name: Unified Lean checks (atlas excluded)

on:
  push:
    branches: [main, codex/unified-lean-github-checks]
    paths: ['lean/**', 'ci/**', '.github/workflows/lean.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-lean-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lean:
    name: Lean / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        group: [main, matched, critical, open-binding]
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          sparse-checkout: |
            lean
            ci
      - name: Validate pinned sources and scope
        run: python3 ci/check_lean.py '${{ matrix.group }}' --validate-only
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/elan.tar.gz" \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  '"$RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd lean
          "$HOME/.elan/bin/lean" --version
      - name: Restore previously checked local modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            lean/.lake/build
            lean/vendor/hadamard6/.lake/build
            lean/vendor/fourier/.lake/build
          key: lean-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lean-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      - name: Fetch official Mathlib cache for pinned dependencies
        run: python3 ci/check_lean.py '${{ matrix.group }}' --cache-only
      - name: Build and inspect theorem assumptions
        run: python3 ci/check_lean.py '${{ matrix.group }}'
      - name: Preserve verification report and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean-${{ matrix.group }}-${{ github.sha }}
          path: ci-results/${{ matrix.group }}/
          retention-days: 30
          if-no-files-found: warn
