name = "nofourmubs"
version = "0.1.0"
defaultTargets = ["NoFourMUBs.MainTheorem"]
weakLeanArgs = ["-j", "2"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[require]]
name = "hadamard6_formal"
path = "vendor/hadamard6"

[[require]]
name = "fourier_formal"
path = "vendor/fourier"

[[lean_lib]]
name = "NoFourMUBs"

[[lean_lib]]
name = "Step1"
srcDir = "Step1Gen/lean"
