name: Corner SOS search

on:
  push:
    branches: [codex/unified-lean-github-checks]
    paths:
      - '.github/workflows/corner-sos.yml'
      - 'audit/corner_sos_search/*.py'
      - 'audit/corner_sos_search/inputs.json'
      - 'audit/corner_sos_search/requirements.txt'
      - 'audit/corner_sos_search/reviewed_heads.json'
      - 'proof/coverage/returns/I_moment_reduction/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  bounded-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        classification-case: ['000', '009', '099', '900', '909', '999']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check current upstream heads against the reuse review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 audit/corner_sos_search/ci_preflight.py
      - name: Check equation adapters and exact-certificate rejection
        working-directory: audit/corner_sos_search
        run: python3 -m unittest -v test_search.py
      - name: Install the discovery solver
        run: |
          python3 -m venv /tmp/corner-sos-venv
          /tmp/corner-sos-venv/bin/python -m pip install -r audit/corner_sos_search/requirements.txt
      - name: Search one classification sector with all six transition Hadamards
        working-directory: audit/corner_sos_search
        run: |
          /tmp/corner-sos-venv/bin/python -u search.py --width 6 --fourier --coupled --moment-reduction --frontier-cap 128 --classification-case '${{ matrix.classification-case }}' --transition-lift --seconds 300 --output runs/github-classification-${{ github.run_id }}-${{ matrix.classification-case }}
      - name: Preserve the exact model and numerical result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corner-sos-${{ github.run_id }}-${{ matrix.classification-case }}
          path: |
            audit/corner_sos_search/runs/github-classification-*
            audit/REPOSITORY_WATCH_STATUS.json
            audit/REPOSITORY_REVIEW_REQUIRED.json
          if-no-files-found: warn
          retention-days: 90
