# Continuous integration: the quick exact replays, the Lean build with its axiom audit, the independent Julia checker
# on a small sub-certificate, and negative tests (each checker must reject targeted corruptions).  The full atlas
# certification (verify.py --atlas, ~23 CPU-hours) and the --lean-full targets are not run here.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (verify.py, negative tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: verify.py (exact replays, Stage C Arb sample)
        run: python3 verify.py -j 4
      - name: Negative tests, Step 1 exact checker
        run: python3 tests/negative_exact.py
      - name: Negative tests, certify.py and nonempty.py
        run: python3 tests/negative_atlas.py -j 4
      - name: Stage C clique search against the reference enumeration
        run: python3 tests/clique_search.py
      - name: certify.py on Records 4900-5099, every intermediate compared with the Mac receipt
        run: |
          (cd proof/atlas && python3 -W ignore certify.py results/atlas_certificate.json.gz 4900 5100 -j 4 --tsv="$RUNNER_TEMP/certify.tsv")
          python3 tests/compare_certify_tsv.py proof/atlas/results/receipts/step4_certify.tsv.gz "$RUNNER_TEMP/certify.tsv" --subset --strict

  lean:
    name: Lean (build and axiom audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space (Mathlib and the Hadamard6 build need ~12 GB of disk)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/lib/jvm /usr/local/share/boost /usr/local/share/chromium /usr/local/share/powershell \
            /opt/microsoft /opt/google /opt/az
          df -h / /mnt
      - name: Add swap (Lake elaborates the large Hadamard6 certificate modules in parallel; the runner has 8 GB of RAM)
        run: |
          sudo fallocate -l 12G /lean-swap
          sudo chmod 600 /lean-swap
          sudo mkswap /lean-swap
          sudo swapon /lean-swap
          free -h; df -h /
      - name: Restore Lean cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan
            lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/lakefile.toml', 'lean/NoFourMUBs.lean', 'lean/NoFourMUBs/**', 'lean/Step1Gen/lean/**') }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      - name: Install elan
        run: |
          if [ ! -x ~/.elan/bin/elan ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prebuilt Mathlib
        working-directory: lean
        run: lake exe cache get
      - name: Build and audit axioms (as verify.py --lean)
        working-directory: lean
        run: |
          python3 check_axioms.py
          free -h; df -h /
      - name: Save Lean cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan
            lean/.lake
          key: ${{ steps.cache.outputs.cache-primary-key }}

  julia:
    name: Julia (independent checker)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JULIA_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Instantiate proof/independent/jlenv
        run: julia --startup-file=no --project=proof/independent/jlenv -e 'using Pkg; Pkg.instantiate()'
      - name: check.jl on a sub-certificate, sanity.jl, negative tests
        run: bash proof/independent/tests/run_tests.sh "$RUNNER_TEMP/indep"
