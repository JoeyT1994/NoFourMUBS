# The tests of the triple-classification certifier. Runs when the certifier or the pinned files it reads change.
name: Triple certifier

on:
  push:
    branches: [main]
    paths:
      - 'TripleClassification/certifier/**'
      - 'proof/**'
      - '.github/workflows/triple-certifier.yml'
      - '!**.md'
  pull_request:
    paths:
      - 'TripleClassification/certifier/**'
      - 'proof/**'
      - '.github/workflows/triple-certifier.yml'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: triple-certifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  triple-certifier:
    name: Triple classification certifier (TripleClassification/certifier)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r TripleClassification/certifier/requirements.txt
      - name: Tests (close, verify, tampering, normal-form and native leaves, the pinned manifest)
        working-directory: TripleClassification/certifier
        run: python -m pytest -q
